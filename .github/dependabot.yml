version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ADR 0001: typescript-eslint doesn't support TypeScript 6.1 or later yet.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Keep the types on the Node version we run.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: terraform
    directories: [/infra, /infra/bootstrap, /infra/modules/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ['*']
